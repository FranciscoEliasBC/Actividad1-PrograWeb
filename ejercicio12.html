<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="css/ejercicio12.css">
        <script src="js/ejercicio12.js"></script>
    </head>
    <body>
        <div class="contenedor">
            <h2>Calculadora Pesos a Dolares</h2>
            <label for="pesos">Pesos (MXN) :</label>
            <input type="number" id="pesos" placeholder="MXN$">
            <button onclick="convertir()">Convertir</button>
            <label for="usd">Dolares  (USD):</label>
            <input type="text" id="usd" readonly placeholder="USD">
        </div>
    </body>
</html>
