<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="css/ejercicio10.css">
        <script src="js/ejercicio10.js"></script>
    </head>
    <body>
        <div class="contenedor">
            <h2>Calculadora °C a °F</h2>
            <label for="celcius">Grados Celsius (°C):</label>
            <input type="number" id="celcius" placeholder="Ejemplo: 25">
            <button onclick="convertir()">Convertir</button>
            <label for="fahrenheit">Resultado  (°F):</label>
            <input type="text" id="fahrenheit" readonly placeholder="Resultado">
        </div>
    </body>
</html>
