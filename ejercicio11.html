<!DOCTYPE html>
<html lang="es">
    <head>

        <title>Calculadora</title>
        <link rel="stylesheet" href="css/ejercicio11.css">
        <script src="js/ejercicio11.js"></script>

    <body>
        <div class="contenedor">
            <h2>Calculadora Kilometros a Millas</h2>
