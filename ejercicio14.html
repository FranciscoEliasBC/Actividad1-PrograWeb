<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="css/ejercicio14.css">
        <script src="js/ejercicio14.js"></script>
    </head>
    <body>
        <div class="contenedor">
            <h2>Calculadora de máximo, mínimo y promedio</h2>
            <label for="edad">Ingresa los digitos separados por comas :</label>
            <input type="text" id="edad" placeholder="Ejemplo: 20, 34, ...">
            <button onclick="convertir()">Calcular</button>
            <label for="mayor"></label>
            <input type="text" id="mayor" readonly placeholder="">
            <label for="menor"></label>
            <input type="text" id="menor" readonly placeholder="">
            <label for="promedio"></label>
            <input type="text" id="promedio" readonly placeholder="">
        </div>
    </body>
</html>
